[project]
name = "browzer"
version = "0.0.1"
description = "A real Chromium page in a terminal that speaks the kitty graphics protocol"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
browzer = "browzer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["browzer"]
